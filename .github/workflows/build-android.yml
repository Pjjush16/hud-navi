name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

env:
  SHERPA_ONNX_VERSION: "1.10.38"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download sherpa-onnx Android SDK
        run: |
          SHERPA_VERSION="${{ env.SHERPA_ONNX_VERSION }}"
          echo "Downloading sherpa-onnx v${SHERPA_VERSION} Android SDK..."
          
          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs
          
          # Download AAR (Java/Kotlin API)
          AAR_URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/sherpa-onnx-v${SHERPA_VERSION}.aar"
          echo "Downloading AAR: $AAR_URL"
          if wget -q "$AAR_URL" -O app/libs/sherpa-onnx.aar 2>&1; then
            echo "AAR downloaded: $(stat -c%s app/libs/sherpa-onnx.aar) bytes"
          else
            echo "WARNING: AAR download failed, trying alternative naming..."
            # Try without 'v' prefix
            wget -q "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/sherpa-onnx-${SHERPA_VERSION}.aar" \
              -O app/libs/sherpa-onnx.aar || echo "AAR not available"
          fi
          
          # Download JNI .so files for all ABIs
          SO_URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/sherpa-onnx-v${SHERPA_VERSION}-android.tar.bz2"
          echo "Downloading JNI libs: $SO_URL"
          if wget -q "$SO_URL" -O /tmp/sherpa-onnx-android.tar.bz2 2>&1; then
            cd /tmp
            tar xjf sherpa-onnx-android.tar.bz2
            # Copy .so files for each ABI
            for abi in arm64-v8a armeabi-v7a; do
              mkdir -p ${{ github.workspace }}/app/src/main/jniLibs/$abi
              if [ -d "sherpa-onnx-v${SHERPA_VERSION}-android/$abi" ]; then
                cp sherpa-onnx-v${SHERPA_VERSION}-android/$abi/*.so \
                   ${{ github.workspace }}/app/src/main/jniLibs/$abi/ 2>/dev/null || true
              fi
            done
            cd ${{ github.workspace }}
            echo "JNI libs installed:"
            find app/src/main/jniLibs -name "*.so" | head -10
          else
            echo "WARNING: JNI libs download failed"
          fi
          
          echo "libs dir:"
          ls -la app/libs/ 2>/dev/null || echo "(empty)"

      - name: Download KWS Model
        run: |
          MODEL_DIR="app/src/main/assets/kws"
          mkdir -p "$MODEL_DIR"
          
          if [ ! -f "$MODEL_DIR/tokens.txt" ]; then
            echo "Downloading sherpa-onnx KWS model..."
            wget -q "https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01-mobile.tar.bz2" \
              -O /tmp/kws-model.tar.bz2
            tar xjf /tmp/kws-model.tar.bz2 -C /tmp/
            
            cp /tmp/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01-mobile/tokens.txt "$MODEL_DIR/"
            cp /tmp/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01-mobile/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx "$MODEL_DIR/"
            cp /tmp/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01-mobile/decoder-epoch-12-avg-2-chunk-16-left-64.onnx "$MODEL_DIR/"
            cp /tmp/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01-mobile/joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx "$MODEL_DIR/"
            
            echo "Model files:"
            ls -la "$MODEL_DIR"
          else
            echo "Model files already exist"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hud-navi-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: hud-navi-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: hud-navi v${{ steps.version.outputs.version }}
          body: |
            **hud-navi v${{ steps.version.outputs.version }}**
            
            Lightweight HUD navigation app for Android.
            
            - Custom app icon
            - Signed release APK
            - OpenStreetMap data attribution
            - Mirror mode for windshield HUD projection
            - **语音唤醒词识别** (哈德/你好小哈/小哈/哈德哈德)
            
            Commit: `${{ github.sha }}`
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
