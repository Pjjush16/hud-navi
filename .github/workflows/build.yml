name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag/branch/commit) to build'
        required: false
        default: 'main'

permissions:
  contents: write

env:
  SHERPA_ONNX_VERSION: "1.13.8"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download sherpa-onnx Android SDK
        run: |
          SHERPA_VERSION="${{ env.SHERPA_ONNX_VERSION }}"
          echo "Downloading sherpa-onnx v${SHERPA_VERSION} Android SDK..."
          
          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs
          
          # Download AAR — 直接使用完整 AAR 文件
          AAR_URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/sherpa-onnx-${SHERPA_VERSION}.aar"
          echo "Downloading AAR: $AAR_URL"
          if wget -q "$AAR_URL" -O app/libs/sherpa-onnx.aar 2>&1; then
            echo "AAR downloaded: $(stat -c%s app/libs/sherpa-onnx.aar) bytes"
            ls -lh app/libs/sherpa-onnx.aar
          else
            echo "WARNING: AAR download failed"
          fi
          
          # 手动从 AAR 中提取 .so 原生库到 jniLibs/
          # 这是确保 fileTree AAR 依赖正确加载 native library 的可靠方法
          echo "Extracting native .so files from AAR..."
          mkdir -p /tmp/aar-extract
          unzip -o app/libs/sherpa-onnx.aar -d /tmp/aar-extract/ > /dev/null 2>&1
          
          # 复制所有架构的 .so 文件
          for arch in arm64-v8a armeabi-v7a x86 x86_64; do
            if [ -d "/tmp/aar-extract/jni/$arch" ]; then
              mkdir -p "app/src/main/jniLibs/$arch"
              cp -v "/tmp/aar-extract/jni/$arch/"*.so "app/src/main/jniLibs/$arch/" 2>/dev/null || true
            fi
          done
          
          echo "=== Extracted jniLibs ==="
          find app/src/main/jniLibs -name "*.so" | sort
          echo "=== AAR contents (jni/) ==="
          ls -la /tmp/aar-extract/jni/ 2>/dev/null || echo "No jni/ in AAR"
          rm -rf /tmp/aar-extract

      - name: Download KWS Model
        run: |
          MODEL_DIR="app/src/main/assets/kws"
          mkdir -p "$MODEL_DIR"
          
          if [ ! -f "$MODEL_DIR/tokens.txt" ]; then
            echo "Downloading sherpa-onnx KWS model..."
            wget -q "https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01-mobile.tar.bz2" \
              -O /tmp/kws-model.tar.bz2
            tar xjf /tmp/kws-model.tar.bz2 -C /tmp/
            
            cp /tmp/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01-mobile/tokens.txt "$MODEL_DIR/"
            cp /tmp/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01-mobile/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx "$MODEL_DIR/"
            cp /tmp/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01-mobile/decoder-epoch-12-avg-2-chunk-16-left-64.onnx "$MODEL_DIR/"
            cp /tmp/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01-mobile/joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx "$MODEL_DIR/"
            
            echo "Model files:"
            ls -la "$MODEL_DIR"
          else
            echo "Model files already exist"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build unsigned Release APK
        run: ./gradlew assembleRelease -Pandroid.injected.signing=false || ./gradlew assembleRelease

      - name: zipalign + sign Release APK
        run: |
          echo "=== zipalign ==="
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          echo "zipalign: $ZIPALIGN"
          echo "apksigner: $APKSIGNER"
          
          mkdir -p app/build/outputs/apk/release-aligned
          
          for apk in app/build/outputs/apk/release/*-release-unsigned.apk app/build/outputs/apk/release/*-release.apk; do
            [ -f "$apk" ] || continue
            base=$(basename "$apk" .apk)
            # Remove signing suffix if present
            base=$(echo "$base" | sed 's/-release-unsigned/-release/' | sed 's/-release/-release/')
            aligned="app/build/outputs/apk/release-aligned/${base}-aligned.apk"
            signed="app/build/outputs/apk/release-aligned/${base}.apk"
            
            echo "Processing: $apk"
            
            # Step 1: zipalign (MUST be before signing)
            $ZIPALIGN -f -v 4 "$apk" "$aligned" 2>&1 | tail -1
            
            # Step 2: sign with apksigner (V1 + V2)
            $APKSIGNER sign \
              --ks keystore/hud-navi-release.jks \
              --ks-key-alias hud-navi \
              --ks-pass pass:hudnavi2026release \
              --key-pass pass:hudnavi2026release \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --out "$signed" \
              "$aligned"
            
            # Step 3: verify
            echo "Verifying $signed..."
            $APKSIGNER verify --verbose --print-certs "$signed" 2>&1 | head -10
            
            # Clean up aligned temp file
            rm -f "$aligned"
          done
          
          echo "=== Final signed APKs ==="
          ls -la app/build/outputs/apk/release-aligned/

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hud-navi-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: hud-navi-release
          path: app/build/outputs/apk/release-aligned/*.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || format('v{0}', steps.version.outputs.version) }}
          name: hud-navi v${{ steps.version.outputs.version }}
          body: |
            **hud-navi v${{ steps.version.outputs.version }}**
            
            Lightweight HUD navigation app for Android.
            
            - Custom app icon
            - Signed release APK
            - OpenStreetMap data attribution
            - Mirror mode for windshield HUD projection
            - **语音唤醒词识别** (哈德/你好小哈/小哈/哈德哈德)
            
            Commit: `${{ github.sha }}`
          files: |
            app/build/outputs/apk/release-aligned/*.apk
            app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
