name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag/branch/commit) to build'
        required: false
        default: 'main'

permissions:
  contents: write

env:
  SHERPA_ONNX_VERSION: "1.13.8"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download sherpa-onnx Android SDK
        run: |
          SHERPA_VERSION="${{ env.SHERPA_ONNX_VERSION }}"
          echo "Downloading sherpa-onnx v${SHERPA_VERSION} Android SDK..."
          
          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs
          
          # Download AAR — 直接使用完整 AAR 文件
          AAR_URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/sherpa-onnx-${SHERPA_VERSION}.aar"
          echo "Downloading AAR: $AAR_URL"
          if wget -q "$AAR_URL" -O app/libs/sherpa-onnx.aar 2>&1; then
            echo "AAR downloaded: $(stat -c%s app/libs/sherpa-onnx.aar) bytes"
            ls -lh app/libs/sherpa-onnx.aar
          else
            echo "WARNING: AAR download failed"
          fi
          
          # 手动从 AAR 中提取 .so 原生库到 jniLibs/
          # 这是确保 fileTree AAR 依赖正确加载 native library 的可靠方法
          echo "Extracting native .so files from AAR..."
          mkdir -p /tmp/aar-extract
          unzip -o app/libs/sherpa-onnx.aar -d /tmp/aar-extract/ > /dev/null 2>&1
          
          # 复制所有架构的 .so 文件
          for arch in arm64-v8a armeabi-v7a x86 x86_64; do
            if [ -d "/tmp/aar-extract/jni/$arch" ]; then
              mkdir -p "app/src/main/jniLibs/$arch"
              cp -v "/tmp/aar-extract/jni/$arch/"*.so "app/src/main/jniLibs/$arch/" 2>/dev/null || true
            fi
          done
          
          echo "=== Extracted jniLibs ==="
          find app/src/main/jniLibs -name "*.so" | sort
          echo "=== AAR contents (jni/) ==="
          ls -la /tmp/aar-extract/jni/ 2>/dev/null || echo "No jni/ in AAR"
          rm -rf /tmp/aar-extract

      - name: Download KWS Model
        run: |
          MODEL_DIR="app/src/main/assets/kws"
          mkdir -p "$MODEL_DIR"
          
          if [ ! -f "$MODEL_DIR/tokens.txt" ]; then
            echo "Downloading sherpa-onnx KWS model..."
            wget -q "https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01-mobile.tar.bz2" \
              -O /tmp/kws-model.tar.bz2
            tar xjf /tmp/kws-model.tar.bz2 -C /tmp/
            
            cp /tmp/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01-mobile/tokens.txt "$MODEL_DIR/"
            cp /tmp/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01-mobile/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx "$MODEL_DIR/"
            cp /tmp/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01-mobile/decoder-epoch-12-avg-2-chunk-16-left-64.onnx "$MODEL_DIR/"
            cp /tmp/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01-mobile/joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx "$MODEL_DIR/"
            
            echo "Model files:"
            ls -la "$MODEL_DIR"
          else
            echo "Model files already exist"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hud-navi-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: hud-navi-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || format('v{0}', steps.version.outputs.version) }}
          name: hud-navi v${{ steps.version.outputs.version }}
          body: |
            **hud-navi v${{ steps.version.outputs.version }}**
            
            Lightweight HUD navigation app for Android.
            
            - Custom app icon
            - Signed release APK
            - OpenStreetMap data attribution
            - Mirror mode for windshield HUD projection
            - **语音唤醒词识别** (哈德/你好小哈/小哈/哈德哈德)
            
            Commit: `${{ github.sha }}`
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
