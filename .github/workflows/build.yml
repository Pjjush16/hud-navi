name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag/branch/commit) to build'
        required: false
        default: 'main'

permissions:
  contents: write

env:
  SHERPA_ONNX_VERSION: "1.13.8"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download sherpa-onnx SDK
        run: |
          mkdir -p app/libs
          wget -q "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${{ env.SHERPA_ONNX_VERSION }}/sherpa-onnx-${{ env.SHERPA_ONNX_VERSION }}.aar" -O /tmp/sherpa-onnx.aar
          mkdir -p /tmp/sherpa-aar-extract
          unzip -qo /tmp/sherpa-onnx.aar -d /tmp/sherpa-aar-extract
          for arch in arm64-v8a armeabi-v7a; do
            if [ -d "/tmp/sherpa-aar-extract/jni/$arch" ]; then
              mkdir -p "app/src/main/jniLibs/$arch"
              cp /tmp/sherpa-aar-extract/jni/$arch/*.so "app/src/main/jniLibs/$arch/"
            fi
          done
          cd /tmp/sherpa-aar-extract && rm -rf jni/ && zip -qr /tmp/sherpa-onnx-nojni.aar . && cd -
          cp /tmp/sherpa-onnx-nojni.aar app/libs/sherpa-onnx.aar
          echo "sherpa-onnx SDK installed"

      - name: Download KWS Model
        run: |
          MODEL_DIR="app/src/main/assets/kws"
          mkdir -p "$MODEL_DIR"
          if [ ! -f "$MODEL_DIR/tokens.txt" ]; then
            wget -q "https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01-mobile.tar.bz2" -O /tmp/kws-model.tar.bz2
            tar xjf /tmp/kws-model.tar.bz2 -C /tmp/
            cp /tmp/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01-mobile/tokens.txt "$MODEL_DIR/"
            cp /tmp/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01-mobile/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx "$MODEL_DIR/"
            cp /tmp/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01-mobile/decoder-epoch-12-avg-2-chunk-16-left-64.onnx "$MODEL_DIR/"
            cp /tmp/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01-mobile/joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx "$MODEL_DIR/"
          fi
          echo "=== Assets ==="
          du -sh app/src/main/assets/

      - name: Download ASR Model (Streaming Zipformer 24MB)
        run: |
          ASR_DIR="app/src/main/assets/asr"
          mkdir -p "$ASR_DIR"
          if [ ! -f "$ASR_DIR/tokens.txt" ]; then
            wget -q "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23-mobile.tar.bz2" -O /tmp/asr-model.tar.bz2
            tar xjf /tmp/asr-model.tar.bz2 -C /tmp/
            cp /tmp/sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23-mobile/encoder-epoch-99-avg-1.int8.onnx "$ASR_DIR/encoder.int8.onnx"
            cp /tmp/sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23-mobile/decoder-epoch-99-avg-1.onnx "$ASR_DIR/decoder.onnx"
            cp /tmp/sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23-mobile/joiner-epoch-99-avg-1.int8.onnx "$ASR_DIR/joiner.int8.onnx"
            cp /tmp/sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23-mobile/tokens.txt "$ASR_DIR/tokens.txt"
            echo "ASR model downloaded (24MB)"
          fi
          echo "=== Assets ==="
          du -sh app/src/main/assets/

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease

      - name: Re-sign Release APKs
        run: |
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/release/*-release.apk; do
            [ -f "$apk" ] || continue
            base=$(basename "$apk" .apk)
            dir=$(dirname "$apk")
            fixed="${dir}/${base}-fixed.apk"
            python3 scripts/fix_native_libs.py "$apk" "$fixed"
            aligned="${dir}/${base}-aligned.apk"
            $ZIPALIGN -v -p 4 "$fixed" "$aligned"
            $APKSIGNER sign \
              --ks keystore/hud-navi-release.jks \
              --ks-pass pass:hudnavi2026release \
              --ks-key-alias hud-navi \
              --key-pass pass:hudnavi2026release \
              --v2-signing-enabled true --v3-signing-enabled true \
              "$aligned"
            mv "$aligned" "$apk" && rm -f "$fixed"
            echo "✅ $(basename $apk) — $(du -sh "$apk" | cut -f1)"
          done

      - name: Verify Release APK
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/release/*-release.apk; do
            [ -f "$apk" ] || continue
            echo "--- $(basename $apk) ---"
            $APKSIGNER verify --verbose --print-certs "$apk" 2>&1
          done

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: hud-navi-apks
          path: |
            app/build/outputs/apk/release/*-release.apk
            app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || format('v{0}', steps.version.outputs.version) }}
          name: hud-navi v${{ steps.version.outputs.version }}
          body: |
            **hud-navi v${{ steps.version.outputs.version }}**

            Lightweight HUD navigation app for Android.

            **v12.0 云端 AI 语音助手：**
            - 🗣️ 唤醒词识别（哈德/小哈/你好小哈）
            - 🧠 智谱 AI 云端语义理解（免费模型 GLM-4.7-Flash）
            - 🔍 联网搜索（SearXNG + Bing 双引擎）
            - 💬 自由聊天 + TTS 语音回复
            - 📋 OOBE 首次配置页面（填 API Key + 选模型）
            - ⚡ APK 仅 ~10MB，无本地大模型

            **使用方式：**
            1. 安装后首次启动进入配置页面
            2. 注册 bigmodel.cn 获取免费 API Key
            3. 选择模型（推荐 GLM-4.7-Flash 免费）
            4. 开始使用语音助手

            跳过配置也可使用，仅支持关键词指令模式。

            Commit: `${{ github.sha }}`
          files: |
            app/build/outputs/apk/release/*-release.apk
            app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
