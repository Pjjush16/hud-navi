# build-mnn-native.yml - 编译 MNN-LLM 原生库并缓存 (v11.1)
#
# 此工作流从 MNN 源码编译 Android arm64-v8a 原生库（.so），
# 然后将编译产物缓存为 GitHub Actions artifact，
# 供主构建工作流 (build.yml) 下载使用。
#
# 手动触发：在 GitHub Actions 页面点击 "Run workflow"
# 定时触发：每周一凌晨自动编译（保持最新）

name: Build MNN-LLM Native

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 1'  # 每周一 18:00 UTC = 周二 02:00 Beijing

jobs:
  build-mnn-android:
    name: Build MNN-LLM for Android arm64
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout MNN source
        uses: actions/checkout@v4
        with:
          repository: alibaba/MNN
          path: mnn-source
          submodules: recursive

      - name: Install NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Build MNN-LLM for arm64-v8a
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd mnn-source/project/android
          mkdir -p build_64
          cd build_64

          # 编译参数说明：
          # - MNN_LOW_MEMORY: 低内存优化，减少运行时内存占用
          # - MNN_BUILD_LLM: 启用 LLM 推理支持
          # - MNN_SUPPORT_TRANSFORMER_FUSE: Transformer 算子融合加速
          # - MNN_ARM82: ARMv8.2 指令集优化（半精度浮点）
          # - MNN_OPENCL: OpenCL GPU 加速支持
          # - MNN_SEP_BUILD: 分离构建（减小体积）
          bash ../build_64.sh \
            "-DMNN_LOW_MEMORY=true \
             -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true \
             -DMNN_BUILD_LLM=true \
             -DMNN_SUPPORT_TRANSFORMER_FUSE=true \
             -DMNN_ARM82=true \
             -DMNN_USE_LOGCAT=true \
             -DMNN_OPENCL=true \
             -DMNN_SEP_BUILD=OFF \
             -DCMAKE_INSTALL_PREFIX=."

          make install

      - name: Collect build artifacts
        run: |
          mkdir -p mnn-libs/arm64-v8a
          mkdir -p mnn-libs/include

          # 收集 .so 文件
          cd mnn-source/project/android/build_64
          find . -name "*.so" -exec cp {} ../../../../mnn-libs/arm64-v8a/ \;

          # 收集头文件
          cd ../../..
          cp -r mnn-source/include/* mnn-libs/include/ 2>/dev/null || true
          cp -r mnn-source/tools/llm mnn-libs/include/ 2>/dev/null || true

          # 显示结果
          echo "=== Built libraries ==="
          ls -lah mnn-libs/arm64-v8a/
          echo "=== Total size ==="
          du -sh mnn-libs/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnn-llm-android-arm64
          path: mnn-libs/
          retention-days: 30

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mnn-libs/arm64-v8a/*.so
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
